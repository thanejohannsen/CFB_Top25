# ============================================================================
#  CFB_Top25 -- every variable the ranking reads. This is THE file to edit.
# ============================================================================
#
#  Change a number, commit, and the next scheduled run uses it. Nothing that
#  affects the ranking is hard-coded anywhere else.
#
#  TUNING.md is the plain-language guide to all of it. The short version:
#
#    THE THREE NUMBERS            [stage1]   w_sor / w_market / w_perf
#      SoR  the resume            who you beat and how hard that was
#      Mkt  Vegas's power rating  how good the money thinks you ARE
#      PPA  the game tape         how well you actually PLAYED, per snap
#      -> these three should sum to 1.0 with w_fpi and w_sos
#
#    THEN ADJUSTED BY             [stage2]   covering the spread, bad losses,
#                                            best win, game control
#    THEN REORDERED BY            [stage4]   head-to-head results
#
#  Try something without committing:
#    python3 -m cfbrank --offline --fixture-year 2026 --year 2026 \
#      --print-top 25 --dry-run --set stage1.w_sor=0.7
#
#  Check whether it helped:
#    python3 scripts/evaluate.py --year 2025 --offline
#
schema_version = 1

[season]
year        = 2026
week        = "auto"      # "auto" = latest completed week, or an integer
season_type = "both"      # "regular" | "postseason" | "both"

[source]
# Committed deliberately, so the scheduled workflow needs no repository secret.
# This repository is PUBLIC, so treat this key as disposable: if it stops
# working, issue a new one at https://collegefootballdata.com/key and replace
# the line below. A CFBD_API_KEY environment variable overrides this value, so
# adding a GitHub Actions secret later takes effect with no code change.
api_key                = "rV3zr53KeMCv9BsNNK+72HQtVn1+zcWE5Kn0fC0GcLgJSstUEbe6CxzI/P1N0TJ6"
base_url               = "https://api.collegefootballdata.com"
cache_dir              = ".cache/cfbd"
cache_ttl_minutes      = 360
timeout_seconds        = 20.0
max_retries            = 4
retry_backoff_seconds  = 1.5
serve_stale_on_failure = true
offline                = false
fixtures_dir           = "tests/fixtures/cfbd"
fixture_year           = "2025"

# -- Stage 1: base order -- the record, the market, and the play-by-play -------
# Every input is a national rank (1 = best), so the base is a weighted rank
# average and lower is better.
[stage1]
w_sor    = 0.55   # the resume: who you beat and how hard that was
w_market = 0.30   # Vegas's power ranking: how good the money thinks you are
w_perf   = 0.15   # the game tape, counted: how well you actually played per snap

# How loudly the resume adjustment speaks, relative to the three numbers above.
# One dial for the whole of [stage2] -- loss quality, best win, game control and
# cover -- so they keep their proportions to each other without four numbers
# having to be edited in step. It lives here rather than in [stage2] because the
# question it answers belongs on this screen: how much should the ADJUSTMENT
# matter next to the three numbers?
#
#   1.0  the adjustment as stage 2 computes it
#   0.5  halved          <- shipped
#   0.0  off entirely; teams sit where the three numbers put them
#
# It was 1.0, and at 1.0 the adjustment swung teams by up to 16.6 rank points --
# larger than most of the base itself. On 2026 week 5, halving it moved the
# adjustment range from -16.62..+2.54 down to -8.31..+2.07.
#
# NOTE what this does NOT fix: scaling the stage scales it for everybody, so a
# team that leads the field on this stage still leads it. Northwestern, whose
# cover credit on four games prompted this, moved exactly one place.
w_adjust = 0.5
#
# Market and PPA split the quality half evenly because that is what measured
# best. Taking the 2025 season, ranking only on what was knowable at the time
# and then predicting the winner of every later game:
#
#     market alone          61.2% of ranked-vs-ranked games
#     play-by-play alone    62.8%
#     50/50 blend           67.3%
#
# Either signal on its own is worse than both together: the market knows about
# injuries and suspensions that no box score shows, and the play-by-play knows
# how a team actually moved the ball regardless of what the closing line said.
#
# w_sor is a different kind of number. It is the share of the ranking that
# belongs to what teams have ACHIEVED rather than how good they look, and no
# backtest can set it -- predicting games is not what a resume is for. 0.50 is a
# judgement, not a measurement: half the ranking is the record, half is quality.
#
# The cost of that choice is visible and worth stating. On the completed 2025
# season a 7-6 Penn State lands at #24: Strength of Record #43, but the market
# rated them 13th and the play-by-play 16th. Push w_sor to 0.60 and they drop
# off the board; drop it to 0.40 and LSU falls from 8th to 17th in 2026. There
# is no setting that satisfies both instincts at once, so the site shows the
# arithmetic for every team and this comment records which way the dial was
# turned and what it cost.
#
# FPI is OFF in the base. Two reasons. The market and the play-by-play do its job
# better, and FPI cannot be honestly backtested: /ratings/fpi serves one
# end-of-season snapshot with no week dimension, so grading it on a finished
# season is reading the answer key. (That bug is how an earlier version of this
# file claimed 75.5% accuracy for SoR + FPI. It was not skill.) FPI still earns
# its keep in stage 4, weighing which head-to-head result to set aside, and as
# the last tiebreak when two teams score identically.
w_fpi    = 0.0    # our rank of the raw FPI rating
#
# Strength of Schedule is OFF by design, not by oversight. Strength of Record
# already means "how good is your record GIVEN who you played", so adding SoS on
# top counts the schedule twice -- and rewards playing hard games whether or not
# you win them. With this term at 0.25 a 3-2 Clemson sat at #16 on schedule alone
# while a 5-0 Georgia with the #2 FPI sat at #23. It stays here as a tunable
# knob, and SoS is still shown on the site; it just no longer moves the ranking.
w_sos       = 0.0    # resumeRanks.strengthOfSchedule (1 = toughest)
pool_size   = 40     # candidate pool; H2H only considered inside it
output_size = 25
require_fpi = true   # teams with no /ratings/fpi entry are excluded
fbs_only    = true   # /ratings/fpi carries a few non-FBS teams; drop them

# -- The market's neutral-field rating, solved from betting lines -------------
# A spread prices a matchup, not a team, so it is decomposed:
#   expected home margin = rating[home] - rating[away] + home_field
# Only FBS-vs-FBS games that have already been PLAYED are used. A line on a game
# nobody has played yet is next week's information, and on a completed season's
# file it is information from the future -- which is the whole reason the old
# backtests lied.
[market]
min_games         = 3     # fewer lined games than this and the team gets no rating
fit_home_field    = true  # measure home field from the lines instead of assuming
home_field_points = 2.5   # seed for the fit, and the value used if fitting is off
#
# horizon_weeks = 1 includes the lines for NEXT week's games, which have closed
# knowing every result so far. That is what makes this a current rating instead
# of an average of stale pre-game guesses: without it, Oklahoma State beating
# Oregon in 2026 as a 24-point home underdog could never move their market
# rating, because the only lines read would be the ones that made them an
# underdog. Two weeks out is NOT allowed -- that line closes after next week has
# been played, and reading it is look-ahead.
horizon_weeks     = 1

# -- The eye test, counted: opponent-adjusted points added per play -----------
# Garbage time is excluded at the fetch. No recency weighting: it was built,
# measured, and it made predictions worse every time. It is tempting because it
# lifts a team that started badly and has since looked great -- which is exactly
# how you talk yourself into a ranking the results do not support.
[performance]
min_games      = 3
fit_home_edge  = true

# -- Stage 2: resume adjustment ("how do your losses look") ------------------
[stage2]
w_loss_quality = 2.5   # rank points per standard deviation
w_best_win     = 2.5
w_game_control = 0.5

# Performance against the number the market set, in rank points per standard
# deviation. The resume says WHO you beat; this says whether you looked like you
# meant it. Beating a bad team by 17 when you were favoured by 28 is a miss;
# beating a good team by 1 when you were favoured by 3 is par -- the asymmetry
# falls out of the arithmetic rather than needing a rule.
#
# On 2026 week 5 this is what moves Notre Dame off the top line: 5-0, but only
# +0.8 against the number (-12 vs Michigan State, -10 at North Carolina), while
# Alabama is +14.1. At 4.0 the top six goes
#   Alabama, Georgia, Miami, Notre Dame, Texas, Ohio State
# against, with this term off,
#   Notre Dame, Alabama, Georgia, Texas, Miami, Ohio State
#
# TWO HONEST CAVEATS, both in engine/cover.py at length:
#  * This can only ever be a MODIFIER. Ranked on its own, cover margin puts
#    Georgia State and New Mexico top of the country -- it measures exceeding
#    expectations, not being good.
#  * Markets are efficient, so this is close to noise: cover rates sit near 50%
#    and past covering barely predicts future covering. Carrying it is a
#    judgement that a ranking should describe how teams have LOOKED, not only
#    what they predict. Set to 0 to turn it off.
w_cover        = 3.5

# How far ONE game may move a team's average, in points past the line.
# OFF, and it was built and measured before being switched off.
#
# The idea: one afternoon should not define a season. Ole Miss lost at Florida by
# 20 against the number on 2026 week 5, and that game alone took their average
# from -1.73 to -6.31.
#
# Why it is off: A CAP DOES NOT MOVE ANYBODY, because this term is z-scored.
# Clipping compresses the whole board, so a team's absolute number improves while
# its standing among 138 teams does not. Ole Miss came out 15th at every cap from
# 10 to none. Meanwhile the cost is real -- the per-game margin has an sd of
# 14.97, so:
#
#    cap    clips     spread of team means
#     10    48.7%     5.83
#     14    34.9%     7.39
#     21    14.4%     9.13
#      0    none     10.36   <- shipped
#
# The one real effect is incidental: a cap clips Northwestern's outsized CREDIT
# and drops them 12th -> 14th, which is the small-sample flattery problem from
# another angle. If that is worth chasing, this is the knob.
cover_game_cap = 0.0

# Centre each game on its VENUE's mean rather than on zero.
#
# The posted line already contains home field, so it is natural to assume this
# measure is venue-neutral. It is not. Measured on completed non-neutral games
# with a line, home teams beat the number by +1.045 in 2025 (n=870, SE 0.511)
# and +1.640 in 2026 (n=384, SE 0.762) -- same direction both seasons at about
# two standard errors each. Home teams covered 54.7% of the time in 2026 against
# road teams' 44.0%. Uncorrected, that is a standing penalty on a road-heavy
# schedule which says nothing about the team.
#
# Measured from the season's own lines rather than assumed, like
# market.fit_home_field. Setting it false scores raw margin against the number.
fit_cover_venue = true

# -- The resume: how hard was this record to earn? ---------------------------
# Walk a reference team through the schedule this team actually played and ask
# how often it would come out with at least this many wins. Low = few teams
# could have matched it. Texas opening 4-0 with Ohio State and Tennessee on the
# card scores 2.6%; a 5-0 against nobody scores far higher.
#
# This REPLACES ESPN's resumeRanks.strengthOfRecord, which it tracks closely at
# the top. The reason is not accuracy, it is honesty: /ratings/fpi serves one
# undated snapshot, so on a finished season it describes the finished season and
# any backtest reading it is reading the answer key. Betting lines are stamped
# per game, so a resume built from them has a real cutoff -- which is what lets
# the whole formula finally be scored. ESPN's number is still published beside
# ours for comparison.
[resume]
min_games       = 3
margin_sigma    = 13.5  # std dev of actual margin around the spread, in points.
                        # The curve is a NORMAL CDF, not a logistic: a logistic
                        # at this scale prices a 30-point favourite at 0.90 when
                        # the real figure is 0.99, and made every resume look
                        # harder than it was.
reference_place = 25    # "could a top-25 team have done this?"

# -- Stage 3: upset regression (big-gap results pull both toward midpoint) ---
[stage3]
enabled  = true
gap      = 15    # base-position gap that triggers regression
strength = 0.5   # 0.5 = halfway to the midpoint. Do NOT set 1.0 (unstable).

# -- Stage 4: weighted head-to-head ordering --------------------------------
[stage4]
# HOW MUCH SHOULD BEATING SOMEONE MATTER? This is that dial -- the positions of
# drift one unit of conviction buys. Measured on 2026 week 5:
#
#     strength    H2H honoured   teams moved   biggest move
#        14           26/27          21          10 places
#         4           24/27          15           3 places     <- shipped
#         2           22/27           5           2 places
#         0           20/27           0           0
#
# Note the last row: with this stage switched OFF, 20 of 27 results are still
# honoured, because the base order already agrees with them. It only ever argues
# about seven games.
#
# It ships at 4 rather than 14 because the resume ALREADY prices head-to-head.
# A resume is a list of games with win probabilities, so beating a good team is
# counted there first: swap Ole Miss's win over LSU for a cupcake at the same
# record and their resume goes from 30.2% to 63.1%, i.e. the win is worth 2.1x
# before this stage touches anything. At 14 the same result was being paid for
# twice, which is what made the ranking feel over-constrained.
#
# Lower also predicts slightly better, monotonically (2025, same 179 games:
# 65.9% at 14, 67.0% at 6, 67.6% at 2, 68.2% at 0). It is NOT set to 0 because
# head-to-head is the premise of this project and the site promises "my team
# beat them and is ranked below them" a real answer; at 0 that section lists 58
# contradictions the ranking does nothing about.
#
#   2 = a tiebreak between teams already close together
#   0 = off, though every contradiction is still reported by stage 5
strength     = 4.0
drift_weight   = 1.0         # cost per position of drift from the base order
drift_exponent = 1.5         # >1 makes long moves disproportionately costly,
                             # so conviction scales how far a result can move a team
split_series = "most_recent" # "most_recent" | "drop" | "aggregate_margin"
max_passes   = 400

[stage4.evidence]
w_margin           = 0.50
w_rating_gap       = 0.30   # agreement with the power ratings (market, FPI if none)
# 0.20 left this dial almost disconnected -- age moved only 4.3% of the
# conviction range, so a week-1 result and a week-12 result cost nearly the same
# to override. At 1.2 age accounts for 23.8% of the range, and a ten-week-old
# result costs 16.3% less to set aside than an identical fresh one, while margin
# remains the single biggest signal.
w_recency          = 1.20
w_common_opponents = 0.15
home_field_points  = 2.5    # fallback; the market's own figure is used when fitted
fit_home_field     = true   # take home field from [market] rather than the line above
margin_cap         = 28

# How cheap is the least convincing result on the board to ignore?
#
# Conviction is a blend of z-scores, so it sits near zero and runs about
# -2.5..+2.5. Turning it into a price needs a floor, and the floor used to be
# `0.10 + (conviction - weakest_on_the_board)`. That made the price RELATIVE:
# whichever game happened to be least convincing was pinned at 0.10, roughly a
# seventeenth of a typical result, however real that game was. It is why a 2025
# Oklahoma State win over Oregon was overridden essentially for free.
#
# conviction_floor is now an absolute level. A result two standard deviations
# below average costs weight_floor because it really is weak; a convincing one
# costs about three times that, not seventeen. Raise weight_floor to make the
# ranking honour head-to-head more stubbornly across the board; raise
# conviction_floor to narrow the gap between a weak result and a strong one.
weight_floor       = 1.0
conviction_floor   = -2.0

# How fast a head-to-head result stops mattering.
#
# A result fades with a half-life in WEEKS, and a convincing one fades slower:
# beating a good team by three scores keeps its force into November, while
# scraping past a bad one in September does not. The split is the board's own
# median conviction, measured WITHOUT the recency term so the half-life a result
# gets is not a function of the age it is about to be judged on.
#
#     weeks old      bad (6wk)    good (8wk)
#             3        0.75          0.81
#             6        0.58          0.66
#            12        0.36          0.45
#
# recency_floor is what they decay TOWARD: an old game fades, it never stops
# having happened.
#
# Note the tension this creates with signature wins, because it is real: Oklahoma
# State beat Oregon in week 2, and that result gets cheaper to override every
# week even on the slower clock.
recency_half_life_good = 8.0
recency_half_life_bad  = 6.0
recency_floor      = 0.15

[output]
rankings_path     = "docs/data/rankings.json"
history_dir       = "docs/data/weeks"
index_path        = "docs/data/index.json"
float_precision   = 4
previous_snapshot = "auto"
include_pool_tail = true
